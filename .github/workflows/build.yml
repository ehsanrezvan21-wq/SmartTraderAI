
name: Build SmartTrader AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/example/smarttraderai
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SmartTraderAI"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.smarttraderai"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.example.smarttraderai"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "0.1"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="SmartTrader AI"
                  android:allowBackup="false"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/smarttraderai/MainActivity.kt <<'EOF'
          package com.example.smarttraderai

          import android.app.Activity
          import android.os.Bundle
          import android.graphics.Color
          import android.view.Gravity
          import android.widget.*

          class MainActivity : Activity() {
              private var active = false

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(24, 32, 24, 24)
                      setBackgroundColor(Color.rgb(16, 25, 35))
                  }

                  fun label(value: String, size: Float) =
                      TextView(this).apply {
                          text = value
                          textSize = size
                          setTextColor(Color.WHITE)
                          setPadding(0, 12, 0, 12)
                      }

                  root.addView(label("SmartTrader AI", 28f))
                  root.addView(label("پنل هوشمند معاملات", 18f))
                  root.addView(label("نماد: XAUUSD | تایم‌فریم: M5", 16f))

                  val status = label("وضعیت: نمایشی، بدون اتصال به MT5", 16f)
                  root.addView(status)

                  root.addView(label("ریسک هر معامله: ۰٫۲۵٪", 16f))
                  root.addView(label(
                      "سیگنال زنده در دسترس نیست؛ هنوز داده بازار وصل نشده است.",
                      14f
                  ))

                  val start = Button(this).apply {
                      text = "شروع حالت نمایشی"
                      setOnClickListener {
                          active = true
                          status.text = "حالت نمایشی فعال است؛ معامله‌ای ارسال نمی‌شود."
                      }
                  }
                  root.addView(start)

                  val stop = Button(this).apply {
                      text = "توقف"
                      setOnClickListener {
                          active = false
                          status.text = "متوقف؛ بدون اتصال به MT5"
                      }
                  }
                  root.addView(stop)

                  root.addView(label(
                      "این نسخه آزمایشی است و سفارش واقعی اجرا نمی‌کند.",
                      13f
                  ))

                  setContentView(root)
              }
          }
          EOF

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartTraderAI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
